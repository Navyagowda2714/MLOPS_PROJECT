name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Unit + integration tests
        run: pytest -v
      - name: Train end-to-end
        run: python -m src.pipeline.train_pipeline

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t mlops-pipeline .
      - name: Smoke-test the container
        run: |
          docker run -d -p 5000:5000 --name api mlops-pipeline
          for i in $(seq 1 20); do curl -sf localhost:5000/health && break; sleep 1; done
          curl -sf localhost:5000/health | grep '"model_loaded":true'
